<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球金融新闻台</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1a1d24; --sub:#6b7280; --line:#e5e7eb;
    --up:#d92e2e; --down:#16a34a; --accent:#2563eb; --warn:#b45309;
    --badge-pri:#0f766e; --badge-sec:#2563eb; --badge-agg:#b45309;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:14px}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  h1{font-size:19px;font-weight:700}
  .sub{color:var(--sub);font-size:12px;margin-top:2px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .search{flex:1;min-width:200px;max-width:340px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px}
  /* clocks */
  .clocks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
  .clock{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .clock .mkt{font-size:12px;color:var(--sub);font-weight:600}
  .clock .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin:3px 0}
  .clock .st{font-size:11px;padding:2px 8px;border-radius:20px;display:inline-block}
  .st.open{background:#dcfce7;color:var(--down)}
  .st.closed{background:#f3f4f6;color:var(--sub)}
  /* ticker */
  .ticker{background:#111827;color:#fff;border-radius:10px;overflow:hidden;margin-bottom:12px;position:relative}
  .ticker .track{display:flex;gap:28px;white-space:nowrap;padding:9px 0;animation:scroll 40s linear infinite}
  .ticker:hover .track{animation-play-state:paused}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
  .tk .nm{color:#9ca3af}
  .up{color:#f87171}.down{color:#4ade80}
  /* filter */
  .filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--sub)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .c{opacity:.7;margin-left:4px}
  /* provenance banner */
  .prov{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--warn);margin-bottom:12px;line-height:1.6}
  .prov b{color:#92400e}
  /* news grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
  .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tag{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600}
  .tag.macro{background:#fef3c7;color:#92400e}
  .tag.sector{background:#dbeafe;color:#1e40af}
  .tag.stock{background:#dcfce7;color:#166534}
  .tag.global{background:#fae8ff;color:#86198f}
  .tag.crypto{background:#ffedd5;color:#9a3412}
  .card h3{font-size:15px;font-weight:700;line-height:1.4}
  .card p{font-size:13px;color:#374151;line-height:1.6}
  .meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
  .srcs{display:flex;flex-direction:column;gap:4px}
  .src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent)}
  .src:hover{text-decoration:underline}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;font-weight:600}
  .b-pri{background:var(--badge-pri)} .b-sec{background:var(--badge-sec)} .b-agg{background:var(--badge-agg)}
  .time{font-size:11px;color:var(--sub);white-space:nowrap}
  .empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px}
  /* 热点榜（微博式排名） */
  .card.hot{flex-direction:row;gap:12px;align-items:stretch}
  .card.hot .rk{flex:0 0 38px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(135deg,#fb7185,#ef4444);border-radius:10px}
  .card.hot:nth-child(2) .rk{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
  .card.hot:nth-child(3) .rk{background:linear-gradient(135deg,#fcd34d,#d97706)}
  .card.hot .hot-body{flex:1;display:flex;flex-direction:column;gap:8px}
  .heat{font-size:11px;color:#ef4444;font-weight:700;white-space:nowrap}
  .hbar{height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden}
  .hbar span{display:block;height:100%;background:linear-gradient(90deg,#fb7185,#ef4444)}
  /* 视图切换按钮 */
  .vbtn{font-size:12px;padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:18px;cursor:pointer;color:var(--sub)}
  .vbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  footer{margin-top:16px;font-size:11px;color:var(--sub);text-align:center;line-height:1.7}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.clocks{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

const CATS=[{k:"all",n:"全部"},{k:"macro",n:"宏观政策"},{k:"sector",n:"行业赛道"},{k:"stock",n:"选股线索"},{k:"global",n:"全球市场"},{k:"crypto",n:"加密行业"}];

/* ===== 热度指数计算标准（与 update_news.py compute_heat 同步，系统内部保留） =====
   热度 = 跨源印证分 + 信源等级分 + 时效分
   跨源印证分：与本条第共享「非泛化金融关键词」的其他新闻条数 × 4
   信源等级分：一手/媒体(sec) = 2；聚合平台(agg) = 1
   时效分：max(0, (48 − 发布小时数)) / 48 × 8（刚发布 8 分，24h 后 4 分，48h 及以上 0 分）
   结果四舍五入保留 1 位小数。
*/

/* 动态加载：优先 fetch news.json（raw.githubusercontent 实时，绕过 Pages CDN 缓存），失败用内置兜底 */
const RAW_URL='https://raw.githubusercontent.com/sherrytong2024-web/Newsdesk/main/news.json';
/* 刷新代理：Cloudflare Worker 托管在远程，服务端保管 GitHub PAT，
   所以任何人（含朋友）点"刷新"都无需 token。部署后把 YOUR-SUBDOMAIN 换成你的 workers.dev 子域 */
const WORKER_URL='https://newsdesk-refresh-proxy.sherrynews.workers.dev/refresh';
const WORKER_KEY=''; // 可选：与 Worker 的 REFRESH_KEY 一致；留空则不校验
let LAST_UPDATED=null;
let _newsSig="";
async function loadNews(force){
  try{
    const r = await fetch(RAW_URL+'?_='+Date.now(), {cache:'no-store'});
    if(r.ok){
      const d = await r.json();
      const items = Array.isArray(d)? d : (d.items||[]);
      if(items.length){
        const sig = items.map(x=>x.title).join('\u0001');
        const changed = force || sig!==_newsSig;
        NEWS=items; LAST_UPDATED=d.updated||LAST_UPDATED; updateMeta();
        if(changed){ _newsSig=sig; renderFilters(); filterNews(); }
        return true;
      }
    }
  }catch(e){ console.warn('news.json 加载失败，使用内置兜底数据', e); }
  return false;
}
function updateMeta(){ const el=document.getElementById('snapTs'); if(el&&LAST_UPDATED) el.textContent=LAST_UPDATED; }
/* 前端点击 → 触发 GitHub Actions 工作流(后端)跑 update_news.py → 轮询 news.json 更新 */
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',3800); }
async function triggerRefresh(){ doTrigger(); }
async function doTrigger(){
  const b=document.getElementById('refreshBtn');
  b.disabled=true; const old=b.textContent; b.textContent='抓取中…';
  try{
    const u=WORKER_URL + (WORKER_KEY? ('?key='+encodeURIComponent(WORKER_KEY)) : '');
    const resp=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'}});
    let data={}; try{ data=await resp.json(); }catch(e){}
    if(resp.ok && data.ok){
      const before=LAST_UPDATED; let ok=false;
      for(let i=0;i<24;i++){
        await new Promise(r=>setTimeout(r,5000));
        if(await pollUpdated(before)){ ok=true; break; }
      }
      b.textContent= ok?'已更新 ✓':'已触发·约1分钟后点此再刷';
      if(!ok) showToast('工作流已触发，云端生成需约1分钟，稍后点按钮刷新');
    }else{
      b.textContent='触发失败';
      showToast('触发失败 ('+(data.status||resp.status)+')：请确认 Worker 已部署并填写 WORKER_URL');
      console.warn('dispatch fail', resp.status, data);
    }
  }catch(e){
    b.textContent='网络错误';
    showToast('网络错误：若在微信内，建议改用系统浏览器(Safari/Chrome)打开');
    console.warn(e);
  }
  setTimeout(()=>{ b.disabled=false; b.textContent=old; }, 2500);
}
async function pollUpdated(before){
  try{
    const r=await fetch(RAW_URL+'?_='+Date.now(),{cache:'no-store'});
    if(r.ok){ const d=await r.json(); const u=d.updated||null; if(u&&u!==before){ NEWS=d.items||NEWS; LAST_UPDATED=u; renderFilters(); filterNews(); updateMeta(); return true; } }
  }catch(e){}
  return false;
}
let curCat="all", curView="grid", HOT=null;

/* 指数滚动条（实时行情：腾讯财经 + Yahoo Finance 双源，每次刷新由 update_news.py 重新抓取注入，无需手填） */
let INDEX = [
{"nm": "道指", "v": "51828.62", "ch": 0.93},
{"nm": "标普500", "v": "7743.41", "ch": 0.51},
{"nm": "纳指", "v": "27068.72", "ch": 0.48},
{"nm": "上证", "v": "3823.62", "ch": -1.67},

{"nm": "创业板", "v": "3139.82", "ch": -4.53},
{"nm": "恒生", "v": "24642.51", "ch": 0.54},
{"nm": "日经225", "v": "65877.62", "ch": -0.73},
{"nm": "韩国KOSPI", "v": "6889.74", "ch": -2.7},
{"nm": "黄金", "v": "4173.8", "ch": -3.41},
{"nm": "WTI原油", "v": "95.7", "ch": 3.56},
{"nm": "美元指数", "v": "101.09", "ch": 0.12}
];

/* 市场时钟 */
const MKTS=[
  {n:"纽约",tz:"America/New_York",open:[9.5,16]}, // 近似交易时段
  {n:"伦敦",tz:"Europe/London",open:[8,16.5]},
  {n:"法兰克福",tz:"Europe/Berlin",open:[9,17.5]},
  {n:"上海",tz:"Asia/Shanghai",open:[9.5,15]},
  {n:"东京",tz:"Asia/Tokyo",open:[9,15]}
];

function fmt(tz){return new Intl.DateTimeFormat('zh-CN',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}
function isOpen(m){const h=new Date().toLocaleString('en-US',{timeZone:m.tz,hour12:false});const hr=parseInt(h.split(':')[0])+parseInt(h.split(':')[1])/60;const day=new Date().toLocaleString('en-US',{timeZone:m.tz,weekday:'short'});const wk=!['Sat','Sun'].includes(day);return wk&&hr>=m.open[0]&&hr<m.open[1]}
function renderClocks(){document.getElementById('clocks').innerHTML=MKTS.map(m=>{const o=isOpen(m);return `<div class="clock"><div class="mkt">${m.n}</div><div class="t">${fmt(m.tz)}</div><span class="st ${o?'open':'closed'}">${o?'交易中':'休市'}</span></div>`}).join('')}
function renderTicker(){const one=INDEX.map(i=>`<span class="tk"><span class="nm">${i.nm}</span><span class="${i.ch>=0?'up':'down'}">${i.v} ${i.ch>=0?'+':''}${i.ch.toFixed(2)}%</span></span>`).join('');document.getElementById('ticker').innerHTML=one+one}
function renderFilters(){document.getElementById('filters').innerHTML=CATS.map(c=>{const cnt=c.k==='all'?NEWS.length:NEWS.filter(n=>n.cat===c.k).length;return `<span class="chip ${curCat===c.k?'on':''}" onclick="setCat('${c.k}')">${c.n}<span class="c">${cnt}</span></span>`}).join('')}
function setCat(k){curCat=k;renderFilters();filterNews()}
function badge(t){return t==='pri'?'<span class="badge b-pri">一手</span>':t==='sec'?'<span class="badge b-sec">二手</span>':'<span class="badge b-agg">聚合</span>'}
async function setView(v){
  curView=v;
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  document.getElementById('filters').style.display = (v==='hot') ? 'none' : '';
  if(v==='hot'){ await loadHot(); renderHot(); }
  else { filterNews(); }
}
async function loadHot(){
  try{ const r=await fetch(RAW_URL.replace('news.json','hot.json')+'?_='+Date.now(),{cache:'no-store'}); if(r.ok){ const d=await r.json(); HOT=d.items||[]; return true; } }catch(e){}
  try{ const r=await fetch('hot.json?_='+Date.now()); if(r.ok){ const d=await r.json(); HOT=d.items||[]; return true; } }catch(e){}
  return false;
}
function renderHot(){
  const grid=document.getElementById('news');
  const list=(HOT||[]).slice(0,10);
  if(!list.length){grid.innerHTML='<div class="empty">暂无热点数据，稍后重试</div>';return;}
  const catName={macro:'宏观',sector:'赛道',stock:'选股',global:'全球',crypto:'加密'};
  const maxH=Math.max.apply(null,list.map(x=>x.heat||1));
  grid.innerHTML=list.map((n,i)=>{
    const srcs=n.srcs.map(s=>`<a class="src" href="${s.u}" target="_blank" rel="noopener">${badge(s.t)} ${s.n} ↗</a>`).join('');
    const w=Math.round((n.heat||0)/maxH*100);
    return `<div class="card hot">
      <div class="rk">${i+1}</div>
      <div class="hot-body">
        <div class="top"><span class="tag ${n.cat}">${catName[n.cat]}</span><span class="time">${n.time}</span><span class="heat">热度 ${n.heat}</span></div>
        <h3>${n.title}</h3>
        <p>${n.summary}</p>
        <div class="meta"><div class="srcs">${srcs}</div></div>
        <div class="hbar"><span style="width:${w}%"></span></div>
      </div>
    </div>`;
  }).join('');
}
function filterNews(){
  if(curView==='hot'){ renderHot(); return; }
  const list=NEWS.filter(n=> curCat==='all'||n.cat===curCat );
  list.sort((a,b)=> (b.time||'').localeCompare(a.time||'')); // 主列表按发布时间倒序：最新在前
  const grid=document.getElementById('news');
  if(!list.length){grid.innerHTML='<div class="empty">无匹配新闻</div>';return}
  grid.innerHTML=list.map(n=>{
    const tagName={macro:'宏观政策',sector:'行业赛道',stock:'选股线索',global:'全球市场',crypto:'加密行业'}[n.cat];
    const srcs=n.srcs.map(s=>`<a class="src" href="${s.u}" target="_blank" rel="noopener">${badge(s.t)} ${s.n} ↗</a>`).join('');
    return `<div class="card">
      <div class="top"><span class="tag ${n.cat}">${tagName}</span><span class="time">${n.time}</span></div>
      <h3>${n.title}</h3>
      <p>${n.summary}</p>
      <div class="meta"><div class="srcs">${srcs}</div></div>
    </div>`;
  }).join('');
}
/* 自动刷新：默认开启，每 30s 静默重拉 news.json / hot.json（仅数据变化时重渲染，避免闪烁） */
async function autoRefresh(){
  renderClocks(); renderTicker();
  await loadNews(false);
  if(curView==='hot'){ await loadHot(); renderHot(); }
}
let autoTimer=setInterval(autoRefresh,30000);

renderClocks();renderTicker();
filterNews();   // 先用内置兜底渲染
loadNews();     // 异步拉取 news.json 最新数据，成功则刷新
setInterval(renderClocks,1000);
</script>
