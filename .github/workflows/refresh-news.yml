name: Refresh News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "hello from refresh-news"
      - run: python3 --version
      - run: python3 outputs/update_news.py
        env:
          NEWSDESK_NO_PUSH: "1"
