name: Refresh News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-news]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 仓库根目录本身就是 outputs/，脚本与生成物都在根目录（不是 outputs/ 子目录）
      - name: Run script
        run: python3 update_news.py
        env:
          NEWSDESK_NO_PUSH: "1"
      - name: Commit and push
        run: |
          git config user.email "newsbot@users.noreply.github.com"
          git config user.name "newsbot"
          git add news.json hot.json financial-news-desk.html archive
          git diff --cached --quiet || git commit -m "auto: refresh news $(date +'%Y-%m-%d %H:%M %Z')"
          git pull --rebase --autostash origin main || true
          git push
