name: Refresh News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-news]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Debug info
        run: |
          echo "=== Python ==="
          which python3
          python3 --version
          echo "=== CWD ==="
          pwd
          echo "=== outputs/ ==="
          ls -la outputs/ 2>&1 || echo "outputs/ missing!"
          echo "=== HTML exists? ==="
          test -f outputs/financial-news-desk.html && echo "YES" || echo "NO"
          echo "=== Script exists? ==="
          test -f outputs/update_news.py && echo "YES" || echo "NO"
          echo "=== HTML marker ==="
          grep -n "let NEWS" outputs/financial-news-desk.html 2>&1 || echo "NOT FOUND"

      - name: Bash sanity check
        run: |
          echo "=== bash works ==="
          pwd
          ls outputs/
          echo "=== which python3 ==="
          which python3 || echo "NOT FOUND"
          python3 --version || echo "VERSION FAIL"
          echo "=== python3 hello ==="
          python3 -c "print('hello')" || echo "HELLO FAIL"

      - name: Import test
        run: python3 -u outputs/_ci_test.py 2>&1

      - name: Run update_news.py
        run: |
          set +e
          python3 -u outputs/update_news.py 2>&1
          EXIT_CODE=$?
          echo "=== SCRIPT EXIT CODE: $EXIT_CODE ==="
          exit $EXIT_CODE
        env:
          NEWSDESK_NO_PUSH: "1"

      - name: Commit and push
        run: |
          git config user.email "newsbot@users.noreply.github.com"
          git config user.name "newsbot"
          git add outputs/news.json outputs/hot.json outputs/financial-news-desk.html outputs/archive
          git diff --cached --quiet || git commit -m "auto: refresh news $(date +'%Y-%m-%d %H:%M %Z')"
          git pull --rebase --autostash origin main || true
          git push
